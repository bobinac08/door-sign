<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Door Sign</title>

<script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100vh;
    overflow:hidden;
    padding:16px;
}

.dashboard{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:16px;
    height:100%;
}

.card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:12px;
    padding:16px;
    display:flex;
    flex-direction:column;
}

.card-header{
    font-size:1.1rem;
    color:#94a3b8;
    margin-bottom:16px;
    font-weight:600;
    text-transform:uppercase;
}

.status-card{
    justify-content:space-between;
}

.location-box{
    background:#0f172a;
    border-left:4px solid #3b82f6;
    border-radius:8px;
    padding:16px;
}

.location-title{
    color:#94a3b8;
    font-size:.85rem;
}

.location-badge{
    font-size:1.3rem;
    font-weight:bold;
    color:#4ade80;
}

.clock{
    text-align:center;
}

.time{
    font-size:2.6rem;
    font-weight:bold;
}

.date{
    color:#94a3b8;
    margin-top:8px;
}

#events{
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.event{
    background:#0f172a;
    border-left:5px solid #38bdf8;
    border-radius:8px;
    padding:14px;
}

.event-time{
    color:#38bdf8;
    font-weight:bold;
    font-size:1rem;
}

.event-title{
    font-size:1.15rem;
    margin-top:4px;
}

.no-events{
    color:#94a3b8;
    text-align:center;
    margin-top:40px;
    font-size:1.2rem;
}
</style>

</head>
<body>

<div class="dashboard">

<div class="card status-card">

<div>
<div class="card-header">📍 Location & Status</div>

<div class="location-box">
<div class="location-title">CURRENT STATUS</div>
<div id="location" class="location-badge">Updating...</div>
</div>

</div>

<div class="clock">
<div id="time" class="time"></div>
<div id="date" class="date"></div>
</div>

</div>

<div class="card">

<div class="card-header">📅 Today's Schedule</div>

<div id="events">
Loading calendar...
</div>

</div>

</div>

<script>

const rawIcsUrl =
'https://outlook.office365.com/owa/calendar/30191564131e4b8394c04f66fa6945b8@wzzm13.com/0f08c3d6e50d4990a24565e07886e96d12628884093217305022/calendar.ics';

const proxiedUrl =
'https://corsproxy.io/?url=' + encodeURIComponent(rawIcsUrl);

function updateClock(){

    const now=new Date();

    document.getElementById("time").textContent=
        now.toLocaleTimeString([],{
            hour:"numeric",
            minute:"2-digit"
        });

    document.getElementById("date").textContent=
        now.toLocaleDateString([],{
            weekday:"long",
            month:"long",
            day:"numeric"
        });

}

setInterval(updateClock,1000);
updateClock();

function updateLocation(){

    const now=new Date();

    const d=now.getDay();
    const h=now.getHours();

    const badge=document.getElementById("location");

    if(d>=1 && d<=5){

        if(h>=8 && h<17){

            badge.textContent="In Office";
            badge.style.color="#4ade80";

        }else{

            badge.textContent="Off the Clock";
            badge.style.color="#94a3b8";

        }

    }else{

        badge.textContent="Out of Office";
        badge.style.color="#f87171";

    }

}

updateLocation();
setInterval(updateLocation,60000);

async function loadCalendar(){

    const container=document.getElementById("events");

    try{

        const response=await fetch(proxiedUrl);

        if(!response.ok)
            throw new Error(response.status);

        const text=await response.text();

        const jcal=ICAL.parse(text);

        const comp=new ICAL.Component(jcal);

        const events=comp.getAllSubcomponents("vevent");

        const today=new Date();

        const startOfDay=new Date(today);
        startOfDay.setHours(0,0,0,0);

        const endOfDay=new Date(today);
        endOfDay.setHours(23,59,59,999);

        const todays=[];

        events.forEach(e=>{

            const event=new ICAL.Event(e);

            const start=event.startDate.toJSDate();

            if(start>=startOfDay && start<=endOfDay){

                todays.push({

                    start,

                    title:event.summary

                });

            }

        });

        todays.sort((a,b)=>a.start-b.start);

        container.innerHTML="";

        if(todays.length===0){

            container.innerHTML=
            '<div class="no-events">No events scheduled today.</div>';

            return;

        }

        todays.forEach(ev=>{

            const div=document.createElement("div");

            div.className="event";

            div.innerHTML=`
                <div class="event-time">
                    ${ev.start.toLocaleTimeString([],{
                        hour:'numeric',
                        minute:'2-digit'
                    })}
                </div>

                <div class="event-title">
                    ${ev.title}
                </div>
            `;

            container.appendChild(div);

        });

    }

    catch(err){

        console.error(err);

        container.innerHTML=
        `<div class="no-events">
        Unable to load calendar.<br><br>${err}
        </div>`;

    }

}

loadCalendar();

setInterval(loadCalendar,600000);

</script>

</body>
</html>

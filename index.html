<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Door Sign</title>

  <!-- FullCalendar & ICAL parsing scripts -->
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.10/index.global.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a; /* Deep slate dark mode */
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 16px;
    }

    /* Landscape 2-Column Layout */
    .dashboard {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      height: 100%;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      font-size: 1.1rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-card {
      justify-content: space-between;
    }

    .clock-box {
      text-align: center;
      padding: 10px 0;
    }

    .time {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffffff;
    }

    .date {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .location-box {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 16px;
      border-left: 4px solid #3b82f6;
    }

    .location-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .location-badge {
      font-size: 1.25rem;
      font-weight: 600;
      color: #38bdf8;
    }

    /* FullCalendar Dark Mode Styling */
    #calendar {
      height: 100%;
      overflow-y: auto;
    }
    
    .fc {
      --fc-border-color: #334155;
      --fc-page-bg-color: transparent;
      --fc-neutral-bg-color: #0f172a;
      --fc-list-event-hover-bg-color: #334155;
      color: #f8fafc;
    }

    .fc-theme-standard .fc-list {
      border: none;
    }

    .fc-list-day-cushion {
      background-color: #0f172a !important;
      color: #38bdf8 !important;
      padding: 12px !important;
      font-size: 1.1rem !important;
    }

    .fc-list-event {
      cursor: default;
    }

    .fc-list-event-title {
      color: #ffffff !important;
      font-size: 1.1rem !important;
      padding: 12px !important;
    }

    .fc-list-event-time {
      color: #94a3b8 !important;
      font-size: 1rem !important;
      padding: 12px !important;
      font-weight: 600;
    }

    .fc-list-empty {
      background-color: transparent !important;
      color: #94a3b8;
      font-size: 1.2rem;
      padding: 40px !important;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="dashboard">

    <!-- Column 1: Status & Clock -->
    <div class="card status-card">
      <div>
        <div class="card-header">📍 Location & Status</div>
        <div class="location-box">
          <div class="location-title">CURRENT STATUS</div>
          <div id="location-badge" class="location-badge">Updating...</div>
        </div>
      </div>

      <div class="clock-box">
        <div id="time" class="time">00:00</div>
        <div id="date" class="date">Loading date...</div>
      </div>
    </div>

    <!-- Column 2: Today's Outlook Agenda -->
    <div class="card">
      <div class="card-header">📅 Today's Schedule</div>
      <div id="calendar"></div>
    </div>

  </div>

  <script>
    // 1. DYNAMIC CLOCK
    function updateClock() {
      const now = new Date();
      const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
      document.getElementById('time').innerText = now.toLocaleTimeString([], timeOptions);

      const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('date').innerText = now.toLocaleDateString([], dateOptions);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. AUTOMATIC LOCATION BY WORK SCHEDULE
    function updateLocationBySchedule() {
      const now = new Date();
      const day = now.getDay();
      const hour = now.getHours();
      const badge = document.getElementById('location-badge');

      if (day >= 1 && day <= 5) {
        if (hour >= 8 && hour < 17) {
          badge.innerText = "In Office";
          badge.style.color = "#4ade80"; // Green
        } else {
          badge.innerText = "Off the Clock";
          badge.style.color = "#94a3b8"; // Gray
        }
      } else {
        badge.innerText = "Out of Office";
        badge.style.color = "#f87171"; // Red
      }
    }
    setInterval(updateLocationBySchedule, 60000);
    updateLocationBySchedule();

    // 3. FULLCALENDAR ICS PARSER WITH CORRECTED PROXY FORMAT
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      
      const rawIcsUrl = 'https://outlook.office365.com/owa/calendar/30191564131e4b8394c04f66fa6945b8@wzzm13.com/0f08c3d6e50d4990a24565e07886e96d12628884093217305022/calendar.ics';
      
      // Updated to standard CorsProxy query string format
      const proxiedIcsUrl = 'https://corsproxy.io/?url=' + encodeURIComponent(rawIcsUrl);

      const calendar = new FullCalendar.Calendar(calendarEl, {
        plugins: [ FullCalendar.iCalendarPlugin ],
        initialView: 'listDay', // Strictly forces today's list view
        headerToolbar: false,  // Hides extra header elements
        noEventsContent: 'No events scheduled for today.',
        events: {
          url: proxiedIcsUrl,
          format: 'ics'
        }
      });

      calendar.render();

      // Refetch events every 10 minutes
      setInterval(() => {
        calendar.refetchEvents();
      }, 600000);
    });
  </script>

</body>
</html>

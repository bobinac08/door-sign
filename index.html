<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Door Sign</title>

  <!-- FullCalendar, ICAL parsing, and Leaflet Maps scripts -->
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.10/index.global.min.js"></script>
  
  <!-- Leaflet CSS & JS for the Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a; 
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 16px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      height: 100%;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      font-size: 1.1rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .status-card {
      justify-content: space-between;
    }

    .clock-box {
      text-align: center;
      padding: 10px 0;
    }

    .time {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffffff;
    }

    .date {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .location-box {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 20px 16px; 
      border-left: 6px solid #3b82f6; 
    }
    
    .availability-box {
      border-left: 6px solid #a855f7; 
      margin-top: 16px;
    }

    .location-title {
      font-size: 1.1rem; 
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .location-badge {
      font-size: 2.8rem; 
      font-weight: 700; 
      line-height: 1.1; 
    }

    /* Paging Button Styling */
    #page-container {
      margin-top: 16px;
      display: none; 
    }

    .page-btn {
      width: 100%;
      background-color: #facc15;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 16px;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .page-btn:active {
      transform: scale(0.98);
    }

    .page-btn:disabled {
      background-color: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Schedule Toggle Tabs Styling */
    .tab-container {
      display: flex;
      gap: 4px;
      background-color: #0f172a;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tab-btn.active {
      background-color: #38bdf8;
      color: #0f172a;
    }

    /* Style for the Map Container */
    #shoot-map-container {
      display: none; 
      margin-top: 16px;
      border-top: 1px solid #334155;
      padding-top: 16px;
    }

    #shoot-location-name {
      font-size: 1.2rem;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }

    #shoot-map {
      height: 180px; 
      width: 100%;
      border-radius: 8px;
      border: 1px solid #334155;
      z-index: 1; 
    }

    #calendar {
      flex-grow: 1; 
      overflow-y: auto;
    }
    
    .fc {
      --fc-border-color: #334155;
      --fc-page-bg-color: transparent;
      --fc-neutral-bg-color: #0f172a;
      --fc-list-event-hover-bg-color: #334155;
      color: #f8fafc;
    }

    .fc-theme-standard .fc-list {
      border: none;
    }

    .fc-list-day-cushion {
      background-color: #0f172a !important;
      color: #38bdf8 !important;
      padding: 16px !important;
      font-size: 1.4rem !important; 
      font-weight: 700;
    }

    .fc-list-event {
      cursor: default;
    }

    .fc-list-event-title {
      color: #ffffff !important;
      font-size: 1.5rem !important; 
      padding: 16px !important;
      transition: all 0.2s ease;
    }

    .fc-list-event-time {
      color: #94a3b8 !important;
      font-size: 1.3rem !important; 
      padding: 16px !important;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .fc-list-empty {
      background-color: transparent !important;
      color: #94a3b8;
      font-size: 1.5rem !important; 
      padding: 40px !important;
      text-align: center;
    }

    /* Custom Active Highlight Class */
    .fc-list-event.active-highlight td {
      background-color: rgba(56, 189, 248, 0.15) !important;
      border-top: 2px solid #38bdf8 !important;
      border-bottom: 2px solid #38bdf8 !important;
    }
    
    .fc-list-event.active-highlight td:first-child {
      border-left: 2px solid #38bdf8 !important;
    }
    
    .fc-list-event.active-highlight td:last-child {
      border-right: 2px solid #38bdf8 !important;
    }

    .fc-list-event.active-highlight .fc-list-event-title {
      color: #ffffff !important;
      font-size: 1.8rem !important; 
      font-weight: 800 !important;
    }

    .fc-list-event.active-highlight .fc-list-event-time {
      color: #ffffff !important;
      font-size: 1.5rem !important; 
      font-weight: 700 !important;
    }

    .fc-list-event-graphic {
      display: none !important;
    }

    .fc-list-event.past-event .fc-list-event-title,
    .fc-list-event.past-event .fc-list-event-time {
      opacity: 0.3 !important;
      text-decoration: line-through !important;
      transition: all 0.3s ease;
    }

    .fc-list-event.hidden-event {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="dashboard">

    <div class="card status-card">
      <div>
        <div class="card-header">📍 Location & Status</div>
        
        <div class="location-box">
          <div class="location-title" id="main-location-title">CURRENTLY</div>
          <div id="location-badge" class="location-badge">Updating...</div>
          
          <div id="shoot-map-container">
            <div id="shoot-location-name"></div>
            <div id="shoot-map"></div>
          </div>
        </div>

        <div id="page-container">
          <button id="page-button" class="page-btn" onclick="sendPageAlert()">🔔 Page Me</button>
        </div>

        <div id="availability-container" class="location-box availability-box">
          <div class="location-title">AVAILABILITY</div>
          <div id="availability-badge" class="location-badge">Loading...</div>
        </div>

        <!-- Dynamic Target Day Block -->
        <div id="target-day-container" class="location-box availability-box" style="display: none;">
          <div class="location-title" id="target-day-title">TOMORROW</div>
          <div id="target-day-badge" class="location-badge" style="font-size: 2.2rem;">Loading...</div>
        </div>
      </div>

      <div class="clock-box">
        <div id="time" class="time">00:00</div>
        <div id="date" class="date">Loading date...</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>📅 Schedule</span>
        <div class="tab-container">
          <button id="btn-today" class="tab-btn active">Today</button>
          <button id="btn-tomorrow" class="tab-btn">Tomorrow</button>
        </div>
      </div>
      <div id="calendar"></div>
    </div>

  </div>

  <script>
    // Global State Variables
    let todayBaseStatus = "In Office";
    let dweetStatus = "In Office";
    let dweetMapData = null;
    let mapInstance = null;
    let mapMarker = null;

    // PAGING LOGIC (NTFY.SH)
    async function sendPageAlert() {
      const btn = document.getElementById('page-button');
      btn.innerText = "Sending...";
      btn.disabled = true;

      try {
        await fetch('https://ntfy.sh', {
          method: 'POST',
          body: JSON.stringify({
            topic: 'bobinac-door-page-19860429',
            message: 'Someone is looking for you at your office door!',
            title: '🚪 Office Door Alert',
            priority: 5,
            tags: ['rotating_light', 'bell']
          })
        });
        
        btn.innerText = "Alert Sent ✓";
        btn.style.backgroundColor = "#4ade80"; 
        btn.style.color = "#0f172a";

        setTimeout(() => {
          btn.innerText = "🔔 Page Me";
          btn.style.backgroundColor = ""; 
          btn.style.color = "";
          btn.disabled = false;
        }, 60000); 

      } catch (error) {
        console.error("Failed to send page:", error);
        btn.innerText = "Error - Try Again";
        btn.style.backgroundColor = "#f87171";
        btn.style.color = "#ffffff";
        
        setTimeout(() => {
          btn.innerText = "🔔 Page Me";
          btn.style.backgroundColor = ""; 
          btn.style.color = "";
          btn.disabled = false;
        }, 4000);
      }
    }

    // 1. DYNAMIC CLOCK
    function updateClock() {
      const now = new Date();
      const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
      document.getElementById('time').innerText = now.toLocaleTimeString([], timeOptions);
      const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('date').innerText = now.toLocaleDateString([], dateOptions);

      if (now.getHours() === 2 && now.getMinutes() === 0 && now.getSeconds() === 0) {
        window.location.reload();
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. LOCATION BY WIFI & TIME (DWEET.CC)
    async function updateLocationStatus() {
      const now = new Date();
      const day = now.getDay();
      
      if (day === 0 || day === 6) {
        dweetStatus = "Off the Clock";
        document.dispatchEvent(new Event('locationUpdated')); 
        return; 
      }
      try {
        const response = await fetch('https://dweet.cc/get/latest/dweet/for/bobinac-door-sign-19860429');
        const data = await response.json();
        
        if (data.this === "succeeded" && data.with && data.with.length > 0) {
          dweetStatus = data.with[0].content.status;
          
          if (dweetStatus === "On Shoot" && data.with[0].content.lat && data.with[0].content.lon) {
             dweetMapData = {
                 lat: parseFloat(data.with[0].content.lat),
                 lon: parseFloat(data.with[0].content.lon),
                 name: data.with[0].content.name || "Shoot Location"
             };
          } else {
             dweetMapData = null;
          }
        }
      } catch (error) {
        console.error("Failed to fetch status:", error);
      }
      
      document.dispatchEvent(new Event('locationUpdated'));
    }
    
    setInterval(updateLocationStatus, 15000);
    updateLocationStatus();

    // 3. FULLCALENDAR & MASTER UI RENDERER
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      const btnToday = document.getElementById('btn-today');
      const btnTomorrow = document.getElementById('btn-tomorrow');
      
      let lastInteractionTime = 0;
      let isInitialLoad = true;

      function switchToTab(tabName) {
        if (tabName === 'today') {
          calendar.today(); 
          btnToday.classList.add('active');
          btnTomorrow.classList.remove('active');
        } else {
          let d = new Date();
          let currentDay = d.getDay();
          let offset = 1;
          if (currentDay === 5) offset = 3; 
          else if (currentDay === 6) offset = 2; 
          else if (currentDay === 0) offset = 1; 
          
          d.setDate(d.getDate() + offset);
          calendar.gotoDate(d); 
          btnTomorrow.classList.add('active');
          btnToday.classList.remove('active');
        }
      }
      
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'listDay', 
        headerToolbar: false,
        noEventsContent: 'No events scheduled.',
        allDayText: '', 
        events: {
          url: 'https://script.google.com/macros/s/AKfycbzKreOXo-BU4tJaEFTJwTHD6sjq8TuV_cPpCXIWyjjO3XcfBbiyBdshodN_qAwTiaw9dA/exec',
          format: 'ics'
        }
      });
      calendar.render();

      btnToday.addEventListener('click', function() {
        lastInteractionTime = Date.now();
        switchToTab('today');
        updateAvailability();
      });

      btnTomorrow.addEventListener('click', function() {
        lastInteractionTime = Date.now();
        switchToTab('tomorrow');
        updateAvailability();
      });

      // MASTER UI RENDERING FUNCTION
      async function updateAvailability() {
        let isBusy = false;
        let overrideMode = "auto";
        let overrideTarget = "";
        
        try {
          const overrideResponse = await fetch('https://dweet.cc/get/latest/dweet/for/bobinac-door-override-19860429');
          const overrideData = await overrideResponse.json();
          if (overrideData.this === "succeeded" && overrideData.with && overrideData.with.length > 0) {
             overrideMode = overrideData.with[0].content.mode || "auto";
             overrideTarget = overrideData.with[0].content.target || "";
          }
        } catch (error) {
          console.error("Failed to fetch override mode:", error);
        }

        const busyOverrides = ["On Lunch", "Meeting", "On Shoot"];
        const hideAvailStatuses = ["stepped out", "on lunch", "meeting", "on shoot", "out of office"]; 
        
        const mainBadge = document.getElementById('location-badge');
        const mainTitle = document.getElementById('main-location-title');
        const availContainer = document.getElementById('availability-container');
        const targetDayContainer = document.getElementById('target-day-container');
        const targetDayBadge = document.getElementById('target-day-badge');
        const mapContainer = document.getElementById('shoot-map-container');
        const pageContainer = document.getElementById('page-container');

        const events = calendar.getEvents();
        const now = new Date();
        const currentDay = now.getDay();
        const isEvening = now.getHours() >= 12; 

        // 1. Calculate the static "Future" Date (Tomorrow or Monday)
        let futureDate = new Date();
        let futureTitle = "TOMORROW";
        
        if (currentDay === 5) { // Friday -> Monday
            futureDate.setDate(futureDate.getDate() + 3);
            futureTitle = "MONDAY";
        } else if (currentDay === 6) { // Saturday -> Monday
            futureDate.setDate(futureDate.getDate() + 2);
            futureTitle = "MONDAY";
        } else if (currentDay === 0) { // Sunday -> Monday
            futureDate.setDate(futureDate.getDate() + 1);
            futureTitle = "MONDAY";
        } else {
            futureDate.setDate(futureDate.getDate() + 1);
            futureTitle = "TOMORROW";
        }

        // 2. Set Default Tab logic (Off the Clock forces Tomorrow tab)
        let defaultTab = 'today';
        if (currentDay === 0 || currentDay === 6 || (dweetStatus.toLowerCase() === "off the clock" && isEvening)) {
            defaultTab = 'tomorrow';
        }

        // Rename tab button dynamically
        if (currentDay === 5 || currentDay === 6 || currentDay === 0) {
           btnTomorrow.innerText = "Monday";
        } else {
           btnTomorrow.innerText = "Tomorrow";
        }

        let isWfhFuture = false;
        let isOooFuture = false;
        let foundWfhToday = false;
        let foundOooToday = false;
        let todayObj = new Date();

        events.forEach(event => {
          let shouldHighlight = false;
          let isTimeActive = (!event.allDay && event.start && event.end && now >= event.start && now < event.end);
          let isPast = (!event.allDay && event.end && now >= event.end); 
          
          let currentTitle = event.title || "";
          let titleUpper = currentTitle.toUpperCase();
          
          if (titleUpper.includes('[X]') || titleUpper.includes('✅') || titleUpper.includes('DONE:')) {
            let cleanTitle = currentTitle.replace(/✅|\[X\]|DONE:/gi, '').trim();
            if (currentTitle !== cleanTitle) {
              event.setExtendedProp('isDoneTask', true); 
              event.setProp('title', cleanTitle); 
              currentTitle = cleanTitle; 
            }
          }
          let isDoneTask = (event.allDay && event.extendedProps.isDoneTask === true);

          let isWfhEvent = (titleUpper === 'WFH' || titleUpper === 'WORKING FROM HOME');
          let isOooEvent = (titleUpper === 'OOO');
          
          if ((isWfhEvent || isOooEvent) && event.allDay && event.start) {
            // Check against Future Date (Tomorrow/Monday)
            if (event.start.getFullYear() === futureDate.getFullYear() && 
                event.start.getMonth() === futureDate.getMonth() && 
                event.start.getDate() === futureDate.getDate()) {
              if (isWfhEvent) isWfhFuture = true;
              if (isOooEvent) isOooFuture = true;
            }
            // Check against Today's Date
            if (event.start.getFullYear() === todayObj.getFullYear() && 
                event.start.getMonth() === todayObj.getMonth() && 
                event.start.getDate() === todayObj.getDate()) {
              if (isWfhEvent) foundWfhToday = true;
              if (isOooEvent) foundOooToday = true;
            }
          }

          if (overrideMode === "auto" && isTimeActive) {
            shouldHighlight = true;
            if (!busyOverrides.includes(dweetStatus)) {
               isBusy = true; 
            }
          }
          
          if (overrideMode === "busy" && overrideTarget !== "") {
             let titleLower = currentTitle.toLowerCase();
             let searchTerms = overrideTarget.toLowerCase().split(/\s+/).filter(word => word !== "");
             let isMatch = searchTerms.length > 0 && searchTerms.every(term => titleLower.includes(term));
             
             if (isMatch) {
                shouldHighlight = true;
             }
          }

          let classNames = [];
          if (isWfhEvent || isOooEvent) {
             classNames.push('hidden-event'); 
          } else {
             if (shouldHighlight && !isDoneTask) {
               classNames.push('active-highlight');
             } else if (isPast || isDoneTask) {
               classNames.push('past-event'); 
             }
          }

          let newClassString = classNames.join(' ');
          let oldClassString = event.classNames.join(' ');
          
          if (newClassString !== oldClassString) {
            event.setProp('classNames', classNames);
          }
        });

        // 3. Determine Final Base Statuses
        if (foundOooToday) {
            todayBaseStatus = "Out of Office";
        } else if (foundWfhToday) {
            todayBaseStatus = "Working From Home";
        } else {
            todayBaseStatus = "In Office";
        }

        let futureBaseStatus = "In Office";
        if (isOooFuture) {
            futureBaseStatus = "Out of Office";
        } else if (isWfhFuture) {
            futureBaseStatus = "Working From Home";
        }

        const activeOverridesList = ["Stepped Out", "On Lunch", "On Shoot", "Meeting", "Off the Clock"];
        let effectiveTodayStatus = activeOverridesList.includes(dweetStatus) ? dweetStatus : todayBaseStatus;
        let statusLower = effectiveTodayStatus.toLowerCase();

        // 4. Color Helper Function
        function getColorForStatus(status) {
            if (status === "In Office") return "#4ade80";
            if (status === "Working From Home") return "#38bdf8";
            if (status === "Out of Office") return "#94a3b8";
            if (status === "Stepped Out") return "#facc15";
            if (status === "On Lunch") return "#fb923c";
            if (status === "On Shoot" || status === "Meeting") return "#f87171";
            if (status === "Off the Clock") return "#94a3b8";
            return "#ffffff";
        }

        // 5. DISPLAY RENDERER - Dynamically updates based on which Tab is active
        let activeTab = btnTomorrow.classList.contains('active') ? 'tomorrow' : 'today';

        if (activeTab === 'tomorrow') {
            // User is looking at the Tomorrow/Monday schedule tab
            mainTitle.innerText = futureTitle; 
            mainBadge.innerText = futureBaseStatus;
            mainBadge.style.color = getColorForStatus(futureBaseStatus);
            
            // Clean up the UI context for a future date
            availContainer.style.display = "none";
            targetDayContainer.style.display = "none";
            mapContainer.style.display = "none";
            pageContainer.style.display = "none";
            
        } else {
            // User is looking at the Today schedule tab
            mainTitle.innerText = "CURRENTLY";
            mainBadge.innerText = effectiveTodayStatus;
            mainBadge.style.color = getColorForStatus(effectiveTodayStatus);

            // Map Logic
            if (effectiveTodayStatus === "On Shoot" && dweetMapData) {
                document.getElementById('shoot-location-name').innerText = `📍 ${dweetMapData.name}`;
                mapContainer.style.display = "block";
                if (!mapInstance) {
                    mapInstance = L.map('shoot-map', { zoomControl: false, attributionControl: false }).setView([dweetMapData.lat, dweetMapData.lon], 13);
                    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
                    mapMarker = L.marker([dweetMapData.lat, dweetMapData.lon]).addTo(mapInstance);
                } else {
                    mapInstance.setView([dweetMapData.lat, dweetMapData.lon], 13);
                    mapMarker.setLatLng([dweetMapData.lat, dweetMapData.lon]);
                    mapInstance.invalidateSize();
                }
            } else {
                mapContainer.style.display = "none";
                if (mapInstance) {
                    mapInstance.remove();
                    mapInstance = null;
                    mapMarker = null;
                }
            }

            // Paging Button
            if (effectiveTodayStatus === "Stepped Out") {
                pageContainer.style.display = "block";
            } else {
                pageContainer.style.display = "none";
            }

            // Availability & Target Day Context Boxes
            if (statusLower === "off the clock") {
                availContainer.style.display = "none";
                targetDayContainer.style.display = "block";
                
                if (isEvening || currentDay === 0 || currentDay === 6) {
                    document.getElementById('target-day-title').innerText = futureTitle;
                    targetDayBadge.innerText = futureBaseStatus;
                    targetDayBadge.style.color = getColorForStatus(futureBaseStatus);
                } else {
                    document.getElementById('target-day-title').innerText = "TODAY";
                    targetDayBadge.innerText = todayBaseStatus;
                    targetDayBadge.style.color = getColorForStatus(todayBaseStatus);
                }
            } else if (hideAvailStatuses.includes(statusLower) || todayBaseStatus === "Out of Office") {
                availContainer.style.display = "none";
                targetDayContainer.style.display = "none";
            } else {
                availContainer.style.display = "block";
                targetDayContainer.style.display = "none";
            }
        }

        // Busy State Calculation
        if (overrideMode === "busy") {
          isBusy = true;
        } else if (overrideMode === "available") {
          isBusy = false;
        } else {
          if (busyOverrides.includes(effectiveTodayStatus)) {
            isBusy = true;
          }
        }

        const availBadge = document.getElementById('availability-badge');
        if (isBusy) {
          availBadge.innerText = "Busy";
          availBadge.style.color = "#f87171"; 
        } else {
          availBadge.innerText = "Available";
          availBadge.style.color = "#4ade80"; 
        }

        // Tab Auto-Revert Logic (5 Minutes)
        if (isInitialLoad) {
            switchToTab(defaultTab);
            isInitialLoad = false;
        } else {
            if (Date.now() - lastInteractionTime > 300000) {
                if (defaultTab === 'today' && !btnToday.classList.contains('active')) {
                    switchToTab('today');
                    updateAvailability();
                } else if (defaultTab === 'tomorrow' && !btnTomorrow.classList.contains('active')) {
                    switchToTab('tomorrow');
                    updateAvailability();
                }
            }
        }
      }

      setInterval(updateAvailability, 60000);
      calendar.on('eventsSet', updateAvailability);
      document.addEventListener('locationUpdated', updateAvailability);

      setInterval(() => {
        calendar.refetchEvents();
      }, 600000);
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Door Sign</title>

  <!-- FullCalendar & ICAL parsing scripts -->
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.10/index.global.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a; 
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 16px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      height: 100%;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      font-size: 1.1rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-card {
      justify-content: space-between;
    }

    .clock-box {
      text-align: center;
      padding: 10px 0;
    }

    .time {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffffff;
    }

    .date {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .location-box {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 20px 16px;
      border-left: 6px solid #3b82f6; 
    }

    /* Added style for the new availability box to separate it slightly */
    .availability-box {
      border-left: 6px solid #a855f7; /* Purple accent */
      margin-top: 16px;
    }

    .location-title {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .location-badge {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.1; 
    }

    /* FullCalendar Dark Mode Styling & Flex Fix */
    #calendar {
      flex-grow: 1; 
      overflow-y: auto;
    }
    
    .fc {
      --fc-border-color: #334155;
      --fc-page-bg-color: transparent;
      --fc-neutral-bg-color: #0f172a;
      --fc-list-event-hover-bg-color: #334155;
      color: #f8fafc;
    }

    .fc-theme-standard .fc-list {
      border: none;
    }

    .fc-list-day-cushion {
      background-color: #0f172a !important;
      color: #38bdf8 !important;
      padding: 16px !important;
      font-size: 1.4rem !important; 
      font-weight: 700;
    }

    .fc-list-event {
      cursor: default;
    }

    .fc-list-event-title {
      color: #ffffff !important;
      font-size: 1.5rem !important; 
      padding: 16px !important;
    }

    .fc-list-event-time {
      color: #94a3b8 !important;
      font-size: 1.3rem !important; 
      padding: 16px !important;
      font-weight: 600;
    }

    .fc-list-empty {
      background-color: transparent !important;
      color: #94a3b8;
      font-size: 1.5rem !important; 
      padding: 40px !important;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="dashboard">

    <!-- Column 1: Status, Availability & Clock -->
    <div class="card status-card">
      <div>
        <div class="card-header">📍 Location & Status</div>
        
        <!-- Location Box -->
        <div class="location-box">
          <div class="location-title">CURRENT STATUS</div>
          <div id="location-badge" class="location-badge">Updating...</div>
        </div>

        <!-- New Availability Box -->
        <div class="location-box availability-box">
          <div class="location-title">AVAILABILITY</div>
          <div id="availability-badge" class="location-badge">Loading...</div>
        </div>
      </div>

      <div class="clock-box">
        <div id="time" class="time">00:00</div>
        <div id="date" class="date">Loading date...</div>
      </div>
    </div>

    <!-- Column 2: Today's Outlook Agenda -->
    <div class="card">
      <div class="card-header">📅 Today's Schedule</div>
      <div id="calendar"></div>
    </div>

  </div>

  <script>
    // 1. DYNAMIC CLOCK
    function updateClock() {
      const now = new Date();
      const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
      document.getElementById('time').innerText = now.toLocaleTimeString([], timeOptions);
      const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('date').innerText = now.toLocaleDateString([], dateOptions);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. LOCATION BY WIFI & TIME (DWEET.CC)
    async function updateLocationStatus() {
      const now = new Date();
      const day = now.getDay();
      const hour = now.getHours();
      const badge = document.getElementById('location-badge');

      // GATEKEEPER: Check if it's outside working hours (Mon-Fri, 8 AM - 4 PM)
      if (day === 0 || day === 6 || hour < 8 || hour >= 16) {
        badge.innerText = "Off the Clock";
        badge.style.color = "#94a3b8"; // Slate Gray
        return; 
      }

      try {
        const response = await fetch('https://dweet.cc/get/latest/dweet/for/bobinac-door-sign-19860429');
        const data = await response.json();
        
        if (data.this === "succeeded" && data.with && data.with.length > 0) {
          const currentStatus = data.with[0].content.status;
          
          badge.innerText = currentStatus;
          
          if (currentStatus === "In Office") {
            badge.style.color = "#4ade80"; // Bright Green
          } else if (currentStatus === "Working From Home") {
            badge.style.color = "#38bdf8"; // Light Blue
          } else if (currentStatus === "Stepped Out") {
            badge.style.color = "#facc15"; // Yellow
          } else if (currentStatus === "On Lunch") {
            badge.style.color = "#fb923c"; // Orange
          } else if (currentStatus === "On Shoot") {
            badge.style.color = "#f87171"; // Red
          } else if (currentStatus === "Meeting") {
            badge.style.color = "#f87171"; // Red
          } else {
            badge.style.color = "#ffffff"; // Default White
          }
        }
      } catch (error) {
        console.error("Failed to fetch status:", error);
      }
    }
    
    setInterval(updateLocationStatus, 15000);
    updateLocationStatus();

    // 3. FULLCALENDAR VIA GOOGLE APPS SCRIPT PROXY
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'listDay',
        headerToolbar: false,
        noEventsContent: 'No events scheduled for today.',
        events: {
          url: 'https://script.google.com/macros/s/AKfycbzKreOXo-BU4tJaEFTJwTHD6sjq8TuV_cPpCXIWyjjO3XcfBbiyBdshodN_qAwTiaw9dA/exec',
          format: 'ics'
        }
      });

      calendar.render();

      // AVAILABILITY LOGIC: Check current time against parsed calendar events
      function updateAvailability() {
        const events = calendar.getEvents();
        const now = new Date();
        let isBusy = false;

        events.forEach(event => {
          if (event.start && event.end) {
            if (now >= event.start && now < event.end) {
              isBusy = true;
            }
          }
        });

        const availBadge = document.getElementById('availability-badge');
        if (isBusy) {
          availBadge.innerText = "Busy";
          availBadge.style.color = "#f87171"; // Red
        } else {
          availBadge.innerText = "Available";
          availBadge.style.color = "#4ade80"; // Bright Green
        }
      }

      // Check availability every 60 seconds
      setInterval(updateAvailability, 60000);
      
      // Update immediately whenever FullCalendar finishes fetching/rendering events
      calendar.on('eventsSet', updateAvailability);

      // Refetch events from Google Script proxy every 10 minutes
      setInterval(() => {
        calendar.refetchEvents();
      }, 600000);
    });
  </script>

</body>
</html>

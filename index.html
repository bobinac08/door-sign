<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Door Sign</title>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 12px;
    }
    .dashboard { display: grid; grid-template-columns: clamp(250px, 29vw, 330px) 1fr; gap: 12px; height: 100%; }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    /* ----- Left column ----- */
    .status-card { gap: 10px; }
    .status-box {
      background-color: #0f172a;
      border-radius: 10px;
      padding: 14px 16px;
      border-left: 8px solid #3b82f6;
      flex: none;
    }
    .status-label { font-size: clamp(0.8rem, 1.4vw, 1rem); color: #94a3b8; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 4px; }
    .status-value { font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 800; line-height: 1.05; overflow-wrap: anywhere; }
    .status-value.small { font-size: clamp(1.5rem, 3.2vw, 2.2rem); }
    .avail-pill {
      display: inline-block;
      margin-top: 12px;
      padding: 9px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: clamp(1rem, 1.85vw, 1.35rem);
      line-height: 1.1;
      color: #0f172a;
      white-space: nowrap;
    }
    .avail-pill.busy { background-color: #f87171; }
    .avail-pill.free { background-color: #4ade80; }
    #page-container { display: none; flex: none; }
    .page-btn {
      width: 100%;
      background-color: #facc15;
      color: #0f172a;
      border: none;
      border-radius: 10px;
      padding: 16px;
      min-height: 56px;
      font-size: clamp(1.1rem, 2.1vw, 1.5rem);
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .page-btn:active { transform: scale(0.98); }
    .page-btn:disabled { background-color: #334155; color: #94a3b8; cursor: not-allowed; }
    .reply-box { border-left-color: #4ade80; display: none; }
    .reply-text { font-size: clamp(1.2rem, 2.3vw, 1.6rem); font-weight: 700; color: #ffffff; line-height: 1.2; }
    .reply-time { font-size: 0.85rem; color: #94a3b8; margin-top: 6px; }
    #shoot-map-container { display: none; flex: 4 1 auto; min-height: 0; flex-direction: column; gap: 6px; }
    #shoot-location-name { font-size: clamp(1rem, 1.9vw, 1.3rem); color: #38bdf8; font-weight: 600; text-align: center; flex: none; }
    #shoot-map { flex: 1 1 auto; min-height: 90px; width: 100%; border-radius: 8px; border: 1px solid #334155; z-index: 1; }
    .spacer { flex: 1 1 0; min-height: 0; }
    .clock-box { text-align: center; flex: none; padding-top: 4px; }
    .time { font-size: clamp(1.8rem, 3.6vw, 2.6rem); font-weight: 700; color: #ffffff; line-height: 1.1; }
    .date { font-size: clamp(0.85rem, 1.5vw, 1rem); color: #94a3b8; margin-top: 2px; }
    .meta { font-size: 0.78rem; color: #64748b; margin-top: 4px; display: flex; justify-content: center; gap: 12px; }
    .meta .stale { color: #f87171; font-weight: 700; }

    /* ----- Schedule ----- */
    .sched-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex: none; }
    .day-label { font-size: clamp(1.1rem, 2.1vw, 1.5rem); font-weight: 700; color: #38bdf8; }
    .tab-container { display: flex; gap: 4px; background-color: #0f172a; padding: 4px; border-radius: 10px; border: 1px solid #334155; }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 10px 18px;
      min-height: 44px;
      font-size: clamp(0.85rem, 1.5vw, 1.05rem);
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tab-btn.active { background-color: #38bdf8; color: #0f172a; }
    #schedule { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
    .section-label { font-size: clamp(0.75rem, 1.3vw, 0.95rem); color: #94a3b8; font-weight: 700; letter-spacing: 0.08em; margin: 6px 4px 6px; }
    .projects { display: none; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .project-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #0f172a;
      border: 2px solid #334155;
      border-left: 8px solid #a855f7;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .project-title { font-size: clamp(1.3rem, 2.6vw, 1.9rem); font-weight: 700; color: #ffffff; line-height: 1.15; flex: 1; }
    .project-row.done { opacity: 0.35; padding: 6px 14px; border-left-color: #64748b; }
    .project-row.done .project-title { text-decoration: line-through; font-size: clamp(1rem, 1.9vw, 1.3rem); font-weight: 600; }
    .project-row.active { background-color: #38bdf8; border-color: #38bdf8; border-left-color: #0ea5e9; padding: 16px 14px; }
    .project-row.active .project-title { color: #0f172a; font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 800; }
    .project-row.active .now-mark { font-size: clamp(0.75rem, 1.3vw, 0.95rem); font-weight: 800; letter-spacing: 0.08em; color: #0f172a; background-color: rgba(15, 23, 42, 0.18); padding: 4px 8px; border-radius: 6px; }
    .project-row .done-mark { font-size: 1.1rem; color: #4ade80; }
    .event-row {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 8px 12px;
      border: 2px solid transparent;
      border-bottom-color: #334155;
      border-radius: 8px;
    }
    .event-time { flex: none; width: clamp(6rem, 10.5vw, 7.6rem); line-height: 1.15; white-space: nowrap; }
    .event-start { font-size: clamp(1rem, 1.85vw, 1.25rem); font-weight: 700; color: #ffffff; }
    .event-end { font-size: clamp(0.8rem, 1.4vw, 1rem); color: #94a3b8; }
    .event-title { flex: 1; font-size: clamp(1rem, 1.9vw, 1.35rem); line-height: 1.2; color: #ffffff; }
    .event-row.soft .event-title { color: #94a3b8; font-style: italic; }   /* Show As: Free or Tentative */
    .event-row.active { background-color: rgba(56, 189, 248, 0.15); border-color: #38bdf8; }
    .event-row.active .event-title, .event-row.active .event-start { font-weight: 800; color: #ffffff; }
    .event-row.past { padding: 5px 12px; opacity: 0.4; }
    .event-row.past .event-end { display: none; }
    .event-row.past .event-start { font-size: clamp(0.85rem, 1.6vw, 1.1rem); font-weight: 600; }
    .event-row.past .event-title { font-size: clamp(0.9rem, 1.7vw, 1.15rem); text-decoration: line-through; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { color: #94a3b8; font-size: clamp(1.1rem, 2.1vw, 1.5rem); text-align: center; padding: 40px 16px; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="card status-card">
      <div class="status-box" id="status-box">
        <div class="status-label">CURRENTLY</div>
        <div id="location-badge" class="status-value">Updating...</div>
        <span id="availability-pill" class="avail-pill free" style="display:none;">Available</span>
      </div>
      <div id="page-container">
        <button id="page-button" class="page-btn">🔔 Page Me</button>
      </div>
      <div id="reply-container" class="status-box reply-box">
        <div class="status-label">MESSAGE FROM ME</div>
        <div id="reply-text" class="reply-text"></div>
        <div id="reply-time" class="reply-time"></div>
      </div>
      <div id="target-day-container" class="status-box" style="display: none;">
        <div class="status-label" id="target-day-title">TOMORROW</div>
        <div id="target-day-badge" class="status-value small">Loading...</div>
      </div>
      <div id="shoot-map-container">
        <div id="shoot-location-name"></div>
        <div id="shoot-map"></div>
      </div>
      <div class="spacer"></div>
      <div class="clock-box">
        <div id="time" class="time">00:00</div>
        <div id="date" class="date">Loading date...</div>
        <div class="meta"><span id="updated">Connecting…</span><span id="battery"></span></div>
      </div>
    </div>

    <div class="card">
      <div class="sched-header">
        <div class="day-label" id="day-header"></div>
        <div class="tab-container">
          <button id="btn-today" class="tab-btn active">Today</button>
          <button id="btn-tomorrow" class="tab-btn">Tomorrow</button>
        </div>
      </div>
      <div id="schedule">
        <div class="section-label" id="projects-label" style="display:none;">WORKING ON</div>
        <div class="projects" id="projects"></div>
        <div class="section-label" id="meetings-label" style="display:none;">MEETINGS &amp; SHOOTS</div>
        <div id="event-list"></div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIG — the only lines you need to edit
    // ============================================================
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxN_FkiY8ceodCnfIwDpw91QBpIikpYsKpqMAxc5d12oFdnUczVcYyM2B9NRskd4Sf0wg/exec';
    const NTFY_TOPIC  = 'door-tv43rbrnglisieaf6zau';

    const STATE_POLL_MS  = 30 * 1000;        // how often to check status/overrides
    const CAL_POLL_MS    = 10 * 60 * 1000;   // how often to re-download the calendar
    const REPLY_TTL_MS   = 15 * 60 * 1000;   // how long a reply message stays on screen
    const TAB_REVERT_MS  = 5 * 60 * 1000;    // return to the default tab after this much inactivity

    const WFH_TITLES = ['WFH', 'WORKING FROM HOME'];
    const OOO_TITLES = ['OOO', 'OUT OF OFFICE', 'PTO'];
    const DONE_CATEGORY = 'DONE';            // Outlook category that marks a task finished
    const DONE_PATTERN = /✅|\[x\]|DONE:/gi; // title markers that also mean finished

    const BUSY_OVERRIDES = ['on lunch', 'meeting', 'on shoot'];
    const HIDE_AVAIL     = ['stepped out', 'on lunch', 'meeting', 'on shoot', 'out of office', 'off the clock'];
    const COLORS = {
      'in office': '#4ade80', 'working from home': '#38bdf8', 'out of office': '#94a3b8',
      'stepped out': '#facc15', 'on lunch': '#fb923c', 'on shoot': '#f87171',
      'meeting': '#f87171', 'off the clock': '#94a3b8'
    };
    const CANON = {
      'in office': 'In Office', 'working from home': 'Working From Home', 'out of office': 'Out of Office',
      'stepped out': 'Stepped Out', 'on lunch': 'On Lunch', 'on shoot': 'On Shoot',
      'meeting': 'Meeting', 'off the clock': 'Off the Clock'
    };

    // ============================================================
    // STATE — fetchers write here, render() reads from here
    // ============================================================
    const state = {
      location: null,   // { status, name, lat, lon, updated }
      override: null,   // { mode, target, updated }
      reply: null,      // { message, updated }
      events: [],       // parsed calendar events
      lastStateOk: 0,
      lastCalOk: 0
    };
    let activeTab = null;           // 'today' | 'tomorrow'
    let lastInteraction = 0;
    let mapInstance = null, mapMarker = null;

    const $ = id => document.getElementById(id);

    // ---------- date helpers ----------
    const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const sameDay = (a, b) => startOfDay(a).getTime() === startOfDay(b).getTime();
    const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
    const isFresh = (rec, now) => !!(rec && rec.updated && sameDay(new Date(rec.updated), now));

    function futureInfo(now) {
      const day = now.getDay();
      let offset = 1, title = 'TOMORROW', btn = 'Tomorrow';
      if (day === 5) { offset = 3; title = 'MONDAY'; btn = 'Monday'; }
      if (day === 6) { offset = 2; title = 'MONDAY'; btn = 'Monday'; }
      if (day === 0) { offset = 1; title = 'MONDAY'; btn = 'Monday'; }
      return { date: addDays(startOfDay(now), offset), title, btn };
    }

    // ============================================================
    // FETCHING
    // ============================================================
    async function fetchState() {
      if (document.hidden) return;
      try {
        const r = await fetch(BACKEND_URL + '?t=' + Date.now(), { cache: 'no-store' });
        const j = await r.json();
        state.location = j.location || null;
        state.override = j.override || null;
        state.reply    = j.reply || null;
        state.lastStateOk = Date.now();
      } catch (e) {
        console.error('State fetch failed:', e);
      }
      render();
    }

    async function fetchCalendar() {
      if (document.hidden) return;
      try {
        const r = await fetch(BACKEND_URL + '?action=calendar&t=' + Date.now(), { cache: 'no-store' });
        const txt = await r.text();
        if (!txt.includes('BEGIN:VCALENDAR')) throw new Error('Response was not an .ics file');
        state.events = parseIcs(txt);
        state.lastCalOk = Date.now();
      } catch (e) {
        console.error('Calendar fetch failed:', e);
      }
      render();
    }

    // ---------- ICS parsing (ical.js) ----------
    function parseIcs(txt) {
      const comp = new ICAL.Component(ICAL.parse(txt));
      // Teach ical.js the Windows time zones Outlook ships inside the file
      comp.getAllSubcomponents('vtimezone').forEach(vtz => {
        try {
          const tz = new ICAL.Timezone(vtz);
          if (!ICAL.TimezoneService.has(tz.tzid)) ICAL.TimezoneService.register(tz.tzid, tz);
        } catch (e) {}
      });

      const now = new Date();
      const rangeStart = startOfDay(addDays(now, -1));
      const rangeEnd   = startOfDay(addDays(now, 16));

      const masters = [], exceptions = {};
      comp.getAllSubcomponents('vevent').forEach(v => {
        const ev = new ICAL.Event(v);
        if (ev.isRecurrenceException()) (exceptions[ev.uid] = exceptions[ev.uid] || []).push(ev);
        else masters.push(ev);
      });

      const out = [];
      masters.forEach(ev => {
        (exceptions[ev.uid] || []).forEach(ex => { try { ev.relateException(ex); } catch (e) {} });
        if (ev.isRecurring()) {
          const iter = ev.iterator();
          let next, guard = 0;
          while ((next = iter.next()) && guard++ < 5000) {
            if (next.toJSDate() > rangeEnd) break;
            let occ;
            try { occ = ev.getOccurrenceDetails(next); } catch (e) { continue; }
            if (occ.endDate.toJSDate() < rangeStart) continue;
            pushEvent(out, occ.item, occ.startDate, occ.endDate);
          }
        } else {
          if (ev.endDate && ev.endDate.toJSDate() < rangeStart) return;
          if (ev.startDate.toJSDate() > rangeEnd) return;
          pushEvent(out, ev, ev.startDate, ev.endDate);
        }
      });
      return out;
    }

    function pushEvent(out, ev, sd, ed) {
      const c = ev.component;
      if (String(c.getFirstPropertyValue('status') || '').toUpperCase() === 'CANCELLED') return;
      const allDay = !!sd.isDate;
      let start = sd.toJSDate();
      let end = ed ? ed.toJSDate() : (allDay ? addDays(start, 1) : new Date(start.getTime() + 3600000));
      if (allDay) { start = startOfDay(start); end = startOfDay(end); }
      const cats = [];
      c.getAllProperties('categories').forEach(p => p.getValues().forEach(v => cats.push(String(v).toUpperCase())));
      const busy = String(c.getFirstPropertyValue('x-microsoft-cdo-busystatus') || '').toUpperCase();
      out.push({ title: ev.summary || '', start, end, allDay, cats, busy });
    }

    // ============================================================
    // DERIVED LOGIC
    // ============================================================
    function isHiddenTitle(ev) {
      const t = ev.title.trim().toUpperCase();
      return ev.allDay && (WFH_TITLES.includes(t) || OOO_TITLES.includes(t));
    }

    // "In Office" / "Working From Home" / "Out of Office" for a given day, read from all-day events
    function baseStatusFor(day) {
      const ds = startOfDay(day).getTime();
      let wfh = false, ooo = false;
      state.events.forEach(ev => {
        if (!ev.allDay) return;
        if (!(ds >= ev.start.getTime() && ds < ev.end.getTime())) return;
        const t = ev.title.trim().toUpperCase();
        if (OOO_TITLES.includes(t) || ev.busy === 'OOF') ooo = true;
        else if (WFH_TITLES.includes(t)) wfh = true;
      });
      return ooo ? 'Out of Office' : wfh ? 'Working From Home' : 'In Office';
    }

    function eventsForDay(day) {
      const ds = startOfDay(day), de = addDays(ds, 1);
      return state.events
        .filter(ev => ev.start < de && ev.end > ds && !isHiddenTitle(ev))
        .sort((a, b) => (b.allDay - a.allDay) || (a.start - b.start));
    }

    function isBusyEvent(ev) { return ev.busy === '' || ev.busy === 'BUSY' || ev.busy === 'OOF'; }
    function isActiveNow(ev, now) { return !ev.allDay && now >= ev.start && now < ev.end; }
    function isDone(ev) { return ev.cats.includes(DONE_CATEGORY) || /✅|\[x\]|DONE:/i.test(ev.title); }
    function cleanTitle(t) { return t.replace(DONE_PATTERN, '').trim(); }

    // The status shown in the "Currently" box
    function effectiveStatus(now, todayBase) {
      const day = now.getDay();
      if (day === 0 || day === 6) return 'Off the Clock';
      const loc = state.location;
      const raw = loc && loc.status ? String(loc.status).trim() : '';
      const lower = raw.toLowerCase();
      const autoWords = ['', 'auto', 'in office', 'working from home'];

      if (autoWords.includes(lower)) return todayBase;

      if (isFresh(loc, now)) return CANON[lower] || raw;

      // Stale (from a previous day): only "Off the Clock" survives, and only on an In Office day,
      // so the sign waits for your arrival ping instead of claiming you're in before you are.
      if (lower === 'off the clock' && todayBase === 'In Office') return 'Off the Clock';
      return todayBase;
    }

    // "until" can be "2:30 PM", "14:30", or a number of minutes ("90"), measured from when it was sent
    function parseUntil(text, sentAt) {
      const t = String(text || '').trim().toLowerCase();
      if (!t) return null;
      if (/^\d{1,3}$/.test(t)) return new Date(sentAt.getTime() + parseInt(t, 10) * 60000);
      const m = t.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?$/);
      if (!m) return null;
      let h = parseInt(m[1], 10), min = m[2] ? parseInt(m[2], 10) : 0;
      const ap = m[3];
      if (ap && ap[0] === 'p' && h < 12) h += 12;
      if (ap && ap[0] === 'a' && h === 12) h = 0;
      if (!ap && h < 7) h += 12;   // bare "2:30" during the workday means 2:30 PM
      return new Date(sentAt.getFullYear(), sentAt.getMonth(), sentAt.getDate(), h, min);
    }

    function currentOverride(now) {
      const o = state.override;
      if (!isFresh(o, now)) return { mode: 'auto', target: '', until: null };
      const until = parseUntil(o.until, new Date(o.updated));
      if (until && now >= until) return { mode: 'auto', target: '', until: null };   // expired → back to auto
      return { mode: String(o.mode || 'auto').toLowerCase(), target: String(o.target || '').trim(), until };
    }

    // ============================================================
    // RENDER — no network calls in here
    // ============================================================
    function render() {
      const now = new Date();
      const day = now.getDay();
      const isWeekend = (day === 0 || day === 6);
      const isEvening = now.getHours() >= 12;
      const fut = futureInfo(now);

      const todayBase  = baseStatusFor(now);
      const futureBase = baseStatusFor(fut.date);
      const status = effectiveStatus(now, todayBase);
      const statusLower = status.toLowerCase();
      const ov = currentOverride(now);

      // Default tab: evenings/weekends point at the next work day
      const defaultTab = (isWeekend || (statusLower === 'off the clock' && isEvening)) ? 'tomorrow' : 'today';
      if (activeTab === null || (Date.now() - lastInteraction > TAB_REVERT_MS)) activeTab = defaultTab;
      $('btn-tomorrow').innerText = fut.btn;
      $('btn-today').classList.toggle('active', activeTab === 'today');
      $('btn-tomorrow').classList.toggle('active', activeTab === 'tomorrow');

      // ---- Left column (always describes NOW; tabs only change the schedule list) ----
      const viewingToday = activeTab === 'today';
      const statusBox = $('status-box'), mainBadge = $('location-badge');
      const availPill = $('availability-pill');
      const targetBox = $('target-day-container'), targetBadge = $('target-day-badge');
      const mapBox = $('shoot-map-container'), pageBox = $('page-container'), replyBox = $('reply-container');
      const offClock = statusLower === 'off the clock';

      mainBadge.innerText = status;
      paintBox(statusBox, COLORS[statusLower] || '#ffffff');

      // Map (its own box so it can flex into the free space)
      const loc = state.location;
      if (statusLower === 'on shoot' && loc && loc.lat && loc.lon) showMap(mapBox, loc);
      else destroyMap(mapBox);

      // Reply message (replaces the Page button while visible)
      const rep = state.reply;
      const replyAge = rep && rep.updated ? Date.now() - new Date(rep.updated).getTime() : Infinity;
      const replyVisible = rep && rep.message && replyAge < REPLY_TTL_MS;
      if (replyVisible) {
        $('reply-text').innerText = rep.message;
        const mins = Math.floor(replyAge / 60000);
        $('reply-time').innerText = mins < 1 ? 'Received just now' : `Received ${mins} min ago`;
      }
      replyBox.style.display = replyVisible ? 'block' : 'none';
      pageBox.style.display = (statusLower === 'stepped out' && !replyVisible) ? 'block' : 'none';

      // ---- Busy / Available (with "until" when the calendar can tell us) ----
      const todayEvents = eventsForDay(now);
      const activeBusy = todayEvents.filter(ev => isActiveNow(ev, now) && isBusyEvent(ev));
      const calendarBusy = activeBusy.length > 0;
      let isBusy, untilText = '';
      if (ov.mode === 'busy') { isBusy = true; if (ov.until) untilText = ' until ' + fmtTime(ov.until); }
      else if (ov.mode === 'available') isBusy = false;
      else {
        isBusy = BUSY_OVERRIDES.includes(statusLower) || calendarBusy;
        if (isBusy && calendarBusy && !BUSY_OVERRIDES.includes(statusLower)) {
          const end = new Date(Math.max(...activeBusy.map(ev => ev.end.getTime())));
          untilText = ' until ' + fmtTime(end);
        } else if (!isBusy) {
          const next = todayEvents.find(ev => !ev.allDay && ev.start > now && isBusyEvent(ev));
          if (next) untilText = ' until ' + fmtTime(next.start);
        }
      }
      availPill.innerText = (isBusy ? 'Busy' : 'Available') + untilText;
      availPill.className = 'avail-pill ' + (isBusy ? 'busy' : 'free');
      const hideAvail = offClock || HIDE_AVAIL.includes(statusLower) || todayBase === 'Out of Office';
      availPill.style.display = hideAvail ? 'none' : 'inline-block';

      // Next-work-day box: shown when off the clock, or whenever the future tab is being viewed
      if (offClock || !viewingToday) {
        const showFuture = !viewingToday || isEvening || isWeekend;
        const tb = showFuture ? futureBase : todayBase;
        $('target-day-title').innerText = showFuture ? fut.title : 'TODAY';
        targetBadge.innerText = tb;
        paintBox(targetBox, COLORS[tb.toLowerCase()] || '#ffffff');
        targetBox.style.display = 'block';
      } else {
        targetBox.style.display = 'none';
      }

      // ---- Schedule ----
      const viewDay = viewingToday ? now : fut.date;
      $('day-header').innerText = (viewingToday ? 'Today' : fut.btn) + ' · ' +
        viewDay.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      const events = viewingToday ? todayEvents : eventsForDay(viewDay);
      const terms = ov.mode === 'busy' ? ov.target.toLowerCase().split(/\s+/).filter(Boolean) : [];
      const matchesTarget = title => terms.length > 0 && terms.every(t => title.toLowerCase().includes(t));

      const projects = $('projects'), list = $('event-list');
      projects.innerHTML = '';
      list.innerHTML = '';

      // All-day items are the day's projects: big rows at the top, finished ones sink and shrink
      const allDay = events.filter(ev => ev.allDay).sort((a, b) => isDone(a) - isDone(b));
      allDay.forEach(ev => {
        const done = isDone(ev), title = cleanTitle(ev.title);
        const row = document.createElement('div');
        row.className = 'project-row' + (done ? ' done' : (matchesTarget(title) ? ' active' : ''));
        const t = document.createElement('div');
        t.className = 'project-title';
        t.innerText = title;
        row.appendChild(t);
        if (done) { const m = document.createElement('div'); m.className = 'done-mark'; m.innerText = '✓'; row.appendChild(m); }
        else if (row.classList.contains('active')) { const m = document.createElement('div'); m.className = 'now-mark'; m.innerText = 'NOW'; row.appendChild(m); }
        projects.appendChild(row);
      });
      projects.style.display = allDay.length ? 'flex' : 'none';
      $('projects-label').style.display = allDay.length ? 'block' : 'none';

      // Timed items: past ones collapse, the active one is highlighted
      const timed = events.filter(ev => !ev.allDay);
      $('meetings-label').style.display = (timed.length && allDay.length) ? 'block' : 'none';
      if (timed.length === 0 && allDay.length === 0) {
        const e = document.createElement('div');
        e.className = 'empty';
        e.innerText = 'No events scheduled.';
        list.appendChild(e);
      }
      timed.forEach(ev => {
        const done = isDone(ev), title = cleanTitle(ev.title);
        const past = now >= ev.end;
        const highlight = !done && ((ov.mode === 'auto' && viewingToday && isActiveNow(ev, now) && isBusyEvent(ev)) || matchesTarget(title));
        const row = document.createElement('div');
        row.className = 'event-row' + (highlight ? ' active' : (past || done ? ' past' : '')) + (isBusyEvent(ev) ? '' : ' soft');
        const time = document.createElement('div');
        time.className = 'event-time';
        const s = document.createElement('div'); s.className = 'event-start'; s.innerText = fmtTime(ev.start);
        const e = document.createElement('div'); e.className = 'event-end'; e.innerText = 'to ' + fmtTime(ev.end);
        time.appendChild(s); time.appendChild(e);
        const t = document.createElement('div');
        t.className = 'event-title';
        t.innerText = title;
        row.appendChild(time);
        row.appendChild(t);
        list.appendChild(row);
      });

      // ---- Freshness stamp ----
      const up = $('updated');
      const stateStale = Date.now() - state.lastStateOk > 3 * 60 * 1000;
      const calStale   = Date.now() - state.lastCalOk > 30 * 60 * 1000;
      if (!state.lastStateOk && !state.lastCalOk) { up.innerText = 'Connecting…'; up.className = ''; }
      else if (stateStale || calStale) { up.innerText = '⚠ ' + (stateStale ? 'Status' : 'Calendar') + ' not updating'; up.className = 'stale'; }
      else { up.innerText = 'Updated ' + fmtTime(new Date(state.lastStateOk)); up.className = ''; }
    }

    // Tints a box with its status color (border + faint background)
    function paintBox(box, hex) {
      box.style.borderLeftColor = hex;
      box.style.backgroundColor = hex + '22';
    }

    // ---------- Map ----------
    function showMap(box, loc) {
      const lat = parseFloat(loc.lat), lon = parseFloat(loc.lon);
      if (isNaN(lat) || isNaN(lon)) { destroyMap(box); return; }
      $('shoot-location-name').innerText = '📍 ' + (loc.name || 'Shoot Location');
      box.style.display = 'flex';
      if (!mapInstance) {
        mapInstance = L.map('shoot-map', { zoomControl: false, attributionControl: false }).setView([lat, lon], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
        mapMarker = L.marker([lat, lon]).addTo(mapInstance);
        setTimeout(() => { if (mapInstance) mapInstance.invalidateSize(); }, 100);
      } else {
        mapInstance.setView([lat, lon], 13);
        mapMarker.setLatLng([lat, lon]);
        mapInstance.invalidateSize();
      }
    }
    function destroyMap(box) {
      box.style.display = 'none';
      if (mapInstance) { mapInstance.remove(); mapInstance = null; mapMarker = null; }
    }

    // ---------- Page Me (ntfy) ----------
    async function sendPageAlert() {
      const btn = $('page-button');
      btn.innerText = 'Sending...';
      btn.disabled = true;
      try {
        await fetch('https://ntfy.sh', {
          method: 'POST',
          body: JSON.stringify({
            topic: NTFY_TOPIC,
            message: 'Someone is looking for you at your office door!',
            title: '🚨 Office Door Alert',
            priority: 5,
            tags: ['rotating_light', 'bell']
          })
        });
        btn.innerText = 'Alert sent ✓';
        setTimeout(() => { btn.innerText = '🔔 Page Me'; btn.disabled = false; }, 60000);
      } catch (e) {
        console.error('Page failed:', e);
        btn.innerText = 'Error – try again';
        setTimeout(() => { btn.innerText = '🔔 Page Me'; btn.disabled = false; }, 4000);
      }
    }

    // ---------- Battery (works in Chromium/Fire WebView; falls back to Fully's API if enabled) ----------
    function updateBattery() {
      const el = $('battery');
      try {
        if (navigator.getBattery) {
          navigator.getBattery().then(b => { el.innerText = (b.charging ? '🔌 ' : '🔋 ') + Math.round(b.level * 100) + '%'; });
        } else if (window.fully && typeof fully.getBatteryLevel === 'function') {
          el.innerText = '🔋 ' + fully.getBatteryLevel() + '%';
        }
      } catch (e) {}
    }

    // ---------- Clock + nightly reload ----------
    function updateClock() {
      const now = new Date();
      $('time').innerText = fmtTime(now);
      $('date').innerText = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }
    function scheduleNightlyReload() {
      const now = new Date();
      let next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 2, 0, 0);
      if (next <= now) next = addDays(next, 1);
      setTimeout(() => location.reload(), next - now);
    }

    // ============================================================
    // START
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      $('btn-today').addEventListener('click', () => { lastInteraction = Date.now(); activeTab = 'today'; render(); });
      $('btn-tomorrow').addEventListener('click', () => { lastInteraction = Date.now(); activeTab = 'tomorrow'; render(); });
      $('page-button').addEventListener('click', sendPageAlert);

      updateClock();
      setInterval(updateClock, 1000);
      updateBattery();
      setInterval(updateBattery, 60000);
      scheduleNightlyReload();

      fetchState();
      fetchCalendar();
      setInterval(fetchState, STATE_POLL_MS);
      setInterval(fetchCalendar, CAL_POLL_MS);
      setInterval(render, 60000);   // keeps "past"/"active" styling and the stamp current between fetches
      document.addEventListener('visibilitychange', () => { if (!document.hidden) { fetchState(); fetchCalendar(); } });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Door Sign</title>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 16px;
    }
    .dashboard { display: grid; grid-template-columns: 280px 1fr; gap: 16px; height: 100%; }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-header {
      font-size: 1.1rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .status-card { justify-content: space-between; }
    .status-card > div:first-child { overflow: hidden; }
    .clock-box { text-align: center; padding: 10px 0 0; }
    .time { font-size: 2.5rem; font-weight: 700; color: #ffffff; }
    .date { font-size: 0.95rem; color: #94a3b8; margin-top: 4px; }
    .meta { font-size: 0.8rem; color: #64748b; margin-top: 6px; display: flex; justify-content: center; gap: 12px; }
    .meta .stale { color: #f87171; font-weight: 700; }
    .location-box {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 20px 16px;
      border-left: 6px solid #3b82f6;
    }
    .availability-box { border-left: 6px solid #a855f7; margin-top: 16px; }
    .reply-box { border-left: 6px solid #4ade80; margin-top: 16px; display: none; }
    .reply-text { font-size: 1.5rem; font-weight: 700; color: #ffffff; line-height: 1.2; }
    .reply-time { font-size: 0.85rem; color: #94a3b8; margin-top: 6px; }
    .location-title { font-size: 1.1rem; color: #94a3b8; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.05em; }
    .location-badge { font-size: 2.8rem; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
    #page-container { margin-top: 16px; display: none; }
    .page-btn {
      width: 100%;
      background-color: #facc15;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 16px;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background-color 0.2s ease;
    }
    .page-btn:active { transform: scale(0.98); }
    .page-btn:disabled { background-color: #334155; color: #94a3b8; cursor: not-allowed; }
    .tab-container { display: flex; gap: 4px; background-color: #0f172a; padding: 3px; border-radius: 8px; border: 1px solid #334155; }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tab-btn.active { background-color: #38bdf8; color: #0f172a; }
    #shoot-map-container { display: none; margin-top: 16px; border-top: 1px solid #334155; padding-top: 16px; }
    #shoot-location-name { font-size: 1.2rem; color: #38bdf8; font-weight: 600; margin-bottom: 8px; text-align: center; }
    #shoot-map { height: 180px; width: 100%; border-radius: 8px; border: 1px solid #334155; z-index: 1; }

    /* Schedule list */
    #schedule { flex-grow: 1; overflow-y: auto; }
    .day-header { color: #38bdf8; font-size: 1.4rem; font-weight: 700; padding: 16px; background-color: #0f172a; border-radius: 8px 8px 0 0; }
    .event-row { display: flex; gap: 16px; padding: 14px 16px; border-bottom: 1px solid #334155; align-items: baseline; border-radius: 8px; }
    .event-time { color: #94a3b8; font-size: 1.3rem; font-weight: 600; min-width: 10.5rem; }
    .event-title { color: #ffffff; font-size: 1.5rem; flex: 1; }
    .event-row.active { background-color: rgba(56, 189, 248, 0.15); border: 2px solid #38bdf8; }
    .event-row.active .event-title { font-size: 1.8rem; font-weight: 800; }
    .event-row.active .event-time { color: #ffffff; font-size: 1.5rem; font-weight: 700; }
    .event-row.past .event-title, .event-row.past .event-time { opacity: 0.3; text-decoration: line-through; }
    .empty { color: #94a3b8; font-size: 1.5rem; text-align: center; padding: 40px; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="card status-card">
      <div>
        <div class="card-header">📍 Location &amp; Status</div>
        <div class="location-box">
          <div class="location-title" id="main-location-title">CURRENTLY</div>
          <div id="location-badge" class="location-badge">Updating...</div>
          <div id="shoot-map-container">
            <div id="shoot-location-name"></div>
            <div id="shoot-map"></div>
          </div>
        </div>
        <div id="page-container">
          <button id="page-button" class="page-btn">🔔 Page Me</button>
        </div>
        <div id="reply-container" class="location-box reply-box">
          <div class="location-title">MESSAGE FROM ME</div>
          <div id="reply-text" class="reply-text"></div>
          <div id="reply-time" class="reply-time"></div>
        </div>
        <div id="availability-container" class="location-box availability-box">
          <div class="location-title">AVAILABILITY</div>
          <div id="availability-badge" class="location-badge">Loading...</div>
        </div>
        <div id="target-day-container" class="location-box availability-box" style="display: none;">
          <div class="location-title" id="target-day-title">TOMORROW</div>
          <div id="target-day-badge" class="location-badge" style="font-size: 2.2rem;">Loading...</div>
        </div>
      </div>
      <div class="clock-box">
        <div id="time" class="time">00:00</div>
        <div id="date" class="date">Loading date...</div>
        <div class="meta"><span id="updated">Connecting…</span><span id="battery"></span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>📅 Schedule</span>
        <div class="tab-container">
          <button id="btn-today" class="tab-btn active">Today</button>
          <button id="btn-tomorrow" class="tab-btn">Tomorrow</button>
        </div>
      </div>
      <div id="schedule">
        <div class="day-header" id="day-header"></div>
        <div id="event-list"></div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIG — the only lines you need to edit
    // ============================================================
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxN_FkiY8ceodCnfIwDpw91QBpIikpYsKpqMAxc5d12oFdnUczVcYyM2B9NRskd4Sf0wg/exec';
    const NTFY_TOPIC  = 'door-tv43rbrnglisieaf6zau';

    const STATE_POLL_MS  = 30 * 1000;        // how often to check status/overrides
    const CAL_POLL_MS    = 10 * 60 * 1000;   // how often to re-download the calendar
    const REPLY_TTL_MS   = 15 * 60 * 1000;   // how long a reply message stays on screen
    const TAB_REVERT_MS  = 5 * 60 * 1000;    // return to the default tab after this much inactivity

    const WFH_TITLES = ['WFH', 'WORKING FROM HOME'];
    const OOO_TITLES = ['OOO', 'OUT OF OFFICE', 'PTO'];
    const DONE_CATEGORY = 'DONE';            // Outlook category that marks a task finished
    const DONE_PATTERN = /✅|\[x\]|DONE:/gi; // title markers that also mean finished

    const BUSY_OVERRIDES = ['on lunch', 'meeting', 'on shoot'];
    const HIDE_AVAIL     = ['stepped out', 'on lunch', 'meeting', 'on shoot', 'out of office', 'off the clock'];
    const COLORS = {
      'in office': '#4ade80', 'working from home': '#38bdf8', 'out of office': '#94a3b8',
      'stepped out': '#facc15', 'on lunch': '#fb923c', 'on shoot': '#f87171',
      'meeting': '#f87171', 'off the clock': '#94a3b8'
    };
    const CANON = {
      'in office': 'In Office', 'working from home': 'Working From Home', 'out of office': 'Out of Office',
      'stepped out': 'Stepped Out', 'on lunch': 'On Lunch', 'on shoot': 'On Shoot',
      'meeting': 'Meeting', 'off the clock': 'Off the Clock'
    };

    // ============================================================
    // STATE — fetchers write here, render() reads from here
    // ============================================================
    const state = {
      location: null,   // { status, name, lat, lon, updated }
      override: null,   // { mode, target, updated }
      reply: null,      // { message, updated }
      events: [],       // parsed calendar events
      lastStateOk: 0,
      lastCalOk: 0
    };
    let activeTab = null;           // 'today' | 'tomorrow'
    let lastInteraction = 0;
    let mapInstance = null, mapMarker = null;

    const $ = id => document.getElementById(id);

    // ---------- date helpers ----------
    const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const sameDay = (a, b) => startOfDay(a).getTime() === startOfDay(b).getTime();
    const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
    const isFresh = (rec, now) => !!(rec && rec.updated && sameDay(new Date(rec.updated), now));

    function futureInfo(now) {
      const day = now.getDay();
      let offset = 1, title = 'TOMORROW', btn = 'Tomorrow';
      if (day === 5) { offset = 3; title = 'MONDAY'; btn = 'Monday'; }
      if (day === 6) { offset = 2; title = 'MONDAY'; btn = 'Monday'; }
      if (day === 0) { offset = 1; title = 'MONDAY'; btn = 'Monday'; }
      return { date: addDays(startOfDay(now), offset), title, btn };
    }

    // ============================================================
    // FETCHING
    // ============================================================
    async function fetchState() {
      if (document.hidden) return;
      try {
        const r = await fetch(BACKEND_URL + '?t=' + Date.now(), { cache: 'no-store' });
        const j = await r.json();
        state.location = j.location || null;
        state.override = j.override || null;
        state.reply    = j.reply || null;
        state.lastStateOk = Date.now();
      } catch (e) {
        console.error('State fetch failed:', e);
      }
      render();
    }

    async function fetchCalendar() {
      if (document.hidden) return;
      try {
        const r = await fetch(BACKEND_URL + '?action=calendar&t=' + Date.now(), { cache: 'no-store' });
        const txt = await r.text();
        if (!txt.includes('BEGIN:VCALENDAR')) throw new Error('Response was not an .ics file');
        state.events = parseIcs(txt);
        state.lastCalOk = Date.now();
      } catch (e) {
        console.error('Calendar fetch failed:', e);
      }
      render();
    }

    // ---------- ICS parsing (ical.js) ----------
    function parseIcs(txt) {
      const comp = new ICAL.Component(ICAL.parse(txt));
      // Teach ical.js the Windows time zones Outlook ships inside the file
      comp.getAllSubcomponents('vtimezone').forEach(vtz => {
        try {
          const tz = new ICAL.Timezone(vtz);
          if (!ICAL.TimezoneService.has(tz.tzid)) ICAL.TimezoneService.register(tz.tzid, tz);
        } catch (e) {}
      });

      const now = new Date();
      const rangeStart = startOfDay(addDays(now, -1));
      const rangeEnd   = startOfDay(addDays(now, 16));

      const masters = [], exceptions = {};
      comp.getAllSubcomponents('vevent').forEach(v => {
        const ev = new ICAL.Event(v);
        if (ev.isRecurrenceException()) (exceptions[ev.uid] = exceptions[ev.uid] || []).push(ev);
        else masters.push(ev);
      });

      const out = [];
      masters.forEach(ev => {
        (exceptions[ev.uid] || []).forEach(ex => { try { ev.relateException(ex); } catch (e) {} });
        if (ev.isRecurring()) {
          const iter = ev.iterator();
          let next, guard = 0;
          while ((next = iter.next()) && guard++ < 5000) {
            if (next.toJSDate() > rangeEnd) break;
            let occ;
            try { occ = ev.getOccurrenceDetails(next); } catch (e) { continue; }
            if (occ.endDate.toJSDate() < rangeStart) continue;
            pushEvent(out, occ.item, occ.startDate, occ.endDate);
          }
        } else {
          if (ev.endDate && ev.endDate.toJSDate() < rangeStart) return;
          if (ev.startDate.toJSDate() > rangeEnd) return;
          pushEvent(out, ev, ev.startDate, ev.endDate);
        }
      });
      return out;
    }

    function pushEvent(out, ev, sd, ed) {
      const c = ev.component;
      if (String(c.getFirstPropertyValue('status') || '').toUpperCase() === 'CANCELLED') return;
      const allDay = !!sd.isDate;
      let start = sd.toJSDate();
      let end = ed ? ed.toJSDate() : (allDay ? addDays(start, 1) : new Date(start.getTime() + 3600000));
      if (allDay) { start = startOfDay(start); end = startOfDay(end); }
      const cats = [];
      c.getAllProperties('categories').forEach(p => p.getValues().forEach(v => cats.push(String(v).toUpperCase())));
      const busy = String(c.getFirstPropertyValue('x-microsoft-cdo-busystatus') || '').toUpperCase();
      out.push({ title: ev.summary || '', start, end, allDay, cats, busy });
    }

    // ============================================================
    // DERIVED LOGIC
    // ============================================================
    function isHiddenTitle(ev) {
      const t = ev.title.trim().toUpperCase();
      return ev.allDay && (WFH_TITLES.includes(t) || OOO_TITLES.includes(t));
    }

    // "In Office" / "Working From Home" / "Out of Office" for a given day, read from all-day events
    function baseStatusFor(day) {
      const ds = startOfDay(day).getTime();
      let wfh = false, ooo = false;
      state.events.forEach(ev => {
        if (!ev.allDay) return;
        if (!(ds >= ev.start.getTime() && ds < ev.end.getTime())) return;
        const t = ev.title.trim().toUpperCase();
        if (OOO_TITLES.includes(t) || ev.busy === 'OOF') ooo = true;
        else if (WFH_TITLES.includes(t)) wfh = true;
      });
      return ooo ? 'Out of Office' : wfh ? 'Working From Home' : 'In Office';
    }

    function eventsForDay(day) {
      const ds = startOfDay(day), de = addDays(ds, 1);
      return state.events
        .filter(ev => ev.start < de && ev.end > ds && !isHiddenTitle(ev))
        .sort((a, b) => (b.allDay - a.allDay) || (a.start - b.start));
    }

    function isBusyEvent(ev) { return ev.busy === '' || ev.busy === 'BUSY' || ev.busy === 'OOF'; }
    function isActiveNow(ev, now) { return !ev.allDay && now >= ev.start && now < ev.end; }
    function isDone(ev) { return ev.cats.includes(DONE_CATEGORY) || /✅|\[x\]|DONE:/i.test(ev.title); }
    function cleanTitle(t) { return t.replace(DONE_PATTERN, '').trim(); }

    // The status shown in the "Currently" box
    function effectiveStatus(now, todayBase) {
      const day = now.getDay();
      if (day === 0 || day === 6) return 'Off the Clock';
      const loc = state.location;
      const raw = loc && loc.status ? String(loc.status).trim() : '';
      const lower = raw.toLowerCase();
      const autoWords = ['', 'auto', 'in office', 'working from home'];

      if (autoWords.includes(lower)) return todayBase;

      if (isFresh(loc, now)) return CANON[lower] || raw;

      // Stale (from a previous day): only "Off the Clock" survives, and only on an In Office day,
      // so the sign waits for your arrival ping instead of claiming you're in before you are.
      if (lower === 'off the clock' && todayBase === 'In Office') return 'Off the Clock';
      return todayBase;
    }

    function currentOverride(now) {
      const o = state.override;
      if (!isFresh(o, now)) return { mode: 'auto', target: '' };
      return { mode: String(o.mode || 'auto').toLowerCase(), target: String(o.target || '').trim() };
    }

    // ============================================================
    // RENDER — no network calls in here
    // ============================================================
    function render() {
      const now = new Date();
      const day = now.getDay();
      const isWeekend = (day === 0 || day === 6);
      const isEvening = now.getHours() >= 12;
      const fut = futureInfo(now);

      const todayBase  = baseStatusFor(now);
      const futureBase = baseStatusFor(fut.date);
      const status = effectiveStatus(now, todayBase);
      const statusLower = status.toLowerCase();
      const ov = currentOverride(now);

      // Default tab: evenings/weekends point at the next work day
      const defaultTab = (isWeekend || (statusLower === 'off the clock' && isEvening)) ? 'tomorrow' : 'today';
      if (activeTab === null || (Date.now() - lastInteraction > TAB_REVERT_MS)) activeTab = defaultTab;
      $('btn-tomorrow').innerText = fut.btn;
      $('btn-today').classList.toggle('active', activeTab === 'today');
      $('btn-tomorrow').classList.toggle('active', activeTab === 'tomorrow');

      // ---- Left column ----
      const viewingToday = activeTab === 'today';
      const mainTitle = $('main-location-title'), mainBadge = $('location-badge');
      const availBox = $('availability-container'), targetBox = $('target-day-container');
      const mapBox = $('shoot-map-container'), pageBox = $('page-container'), replyBox = $('reply-container');

      // The left column always describes NOW; the tabs only change the schedule list.
      mainTitle.innerText = 'CURRENTLY';
      mainBadge.innerText = status;
      mainBadge.style.color = COLORS[statusLower] || '#ffffff';

      // Map
      const loc = state.location;
      if (statusLower === 'on shoot' && loc && loc.lat && loc.lon) showMap(mapBox, loc);
      else destroyMap(mapBox);

      // Reply message (replaces the Page button while visible)
      const rep = state.reply;
      const replyAge = rep && rep.updated ? Date.now() - new Date(rep.updated).getTime() : Infinity;
      const replyVisible = rep && rep.message && replyAge < REPLY_TTL_MS;
      if (replyVisible) {
        $('reply-text').innerText = rep.message;
        const mins = Math.floor(replyAge / 60000);
        $('reply-time').innerText = mins < 1 ? 'Received just now' : `Received ${mins} min ago`;
      }
      replyBox.style.display = replyVisible ? 'block' : 'none';
      pageBox.style.display = (statusLower === 'stepped out' && !replyVisible) ? 'block' : 'none';

      // Availability box: hidden when it's implied by the status
      const offClock = statusLower === 'off the clock';
      availBox.style.display = (offClock || HIDE_AVAIL.includes(statusLower) || todayBase === 'Out of Office') ? 'none' : 'block';

      // Next-work-day box: shown when off the clock, or whenever the future tab is being viewed
      if (offClock || !viewingToday) {
        const showFuture = !viewingToday || isEvening || isWeekend;
        const tb = showFuture ? futureBase : todayBase;
        $('target-day-title').innerText = showFuture ? fut.title : 'TODAY';
        $('target-day-badge').innerText = tb;
        $('target-day-badge').style.color = COLORS[tb.toLowerCase()] || '#ffffff';
        targetBox.style.display = 'block';
      } else {
        targetBox.style.display = 'none';
      }

      // ---- Busy / Available ----
      const todayEvents = eventsForDay(now);
      const calendarBusy = todayEvents.some(ev => isActiveNow(ev, now) && isBusyEvent(ev));
      let isBusy;
      if (ov.mode === 'busy') isBusy = true;
      else if (ov.mode === 'available') isBusy = false;
      else isBusy = BUSY_OVERRIDES.includes(statusLower) || calendarBusy;
      const ab = $('availability-badge');
      ab.innerText = isBusy ? 'Busy' : 'Available';
      ab.style.color = isBusy ? '#f87171' : '#4ade80';

      // ---- Schedule list ----
      const viewDay = viewingToday ? now : fut.date;
      $('day-header').innerText = viewDay.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
      const list = $('event-list');
      list.innerHTML = '';
      const events = viewingToday ? todayEvents : eventsForDay(viewDay);
      if (events.length === 0) {
        const e = document.createElement('div');
        e.className = 'empty';
        e.innerText = 'No events scheduled.';
        list.appendChild(e);
      }
      const terms = ov.mode === 'busy' ? ov.target.toLowerCase().split(/\s+/).filter(Boolean) : [];
      events.forEach(ev => {
        const done = isDone(ev);
        const title = cleanTitle(ev.title);
        const past = !ev.allDay && now >= ev.end;
        let highlight = false;
        if (ov.mode === 'auto' && viewingToday && isActiveNow(ev, now) && isBusyEvent(ev)) highlight = true;
        if (terms.length && terms.every(t => title.toLowerCase().includes(t))) highlight = true;

        const row = document.createElement('div');
        row.className = 'event-row' + (highlight && !done ? ' active' : (past || done ? ' past' : ''));
        const time = document.createElement('div');
        time.className = 'event-time';
        time.innerText = ev.allDay ? '' : `${fmtTime(ev.start)} – ${fmtTime(ev.end)}`;
        const t = document.createElement('div');
        t.className = 'event-title';
        t.innerText = title;
        row.appendChild(time);
        row.appendChild(t);
        list.appendChild(row);
      });

      // ---- Freshness stamp ----
      const up = $('updated');
      const stateStale = Date.now() - state.lastStateOk > 3 * 60 * 1000;
      const calStale   = Date.now() - state.lastCalOk > 30 * 60 * 1000;
      if (!state.lastStateOk && !state.lastCalOk) { up.innerText = 'Connecting…'; up.className = ''; }
      else if (stateStale || calStale) { up.innerText = '⚠ ' + (stateStale ? 'Status' : 'Calendar') + ' not updating'; up.className = 'stale'; }
      else { up.innerText = 'Updated ' + fmtTime(new Date(state.lastStateOk)); up.className = ''; }
    }

    // ---------- Map ----------
    function showMap(box, loc) {
      const lat = parseFloat(loc.lat), lon = parseFloat(loc.lon);
      if (isNaN(lat) || isNaN(lon)) { destroyMap(box); return; }
      $('shoot-location-name').innerText = '📍 ' + (loc.name || 'Shoot Location');
      box.style.display = 'block';
      if (!mapInstance) {
        mapInstance = L.map('shoot-map', { zoomControl: false, attributionControl: false }).setView([lat, lon], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
        mapMarker = L.marker([lat, lon]).addTo(mapInstance);
      } else {
        mapInstance.setView([lat, lon], 13);
        mapMarker.setLatLng([lat, lon]);
        mapInstance.invalidateSize();
      }
    }
    function destroyMap(box) {
      box.style.display = 'none';
      if (mapInstance) { mapInstance.remove(); mapInstance = null; mapMarker = null; }
    }

    // ---------- Page Me (ntfy) ----------
    async function sendPageAlert() {
      const btn = $('page-button');
      btn.innerText = 'Sending...';
      btn.disabled = true;
      try {
        await fetch('https://ntfy.sh', {
          method: 'POST',
          body: JSON.stringify({
            topic: NTFY_TOPIC,
            message: 'Someone is looking for you at your office door!',
            title: '🚨 Office Door Alert',
            priority: 5,
            tags: ['rotating_light', 'bell']
          })
        });
        btn.innerText = 'Alert sent ✓';
        setTimeout(() => { btn.innerText = '🔔 Page Me'; btn.disabled = false; }, 60000);
      } catch (e) {
        console.error('Page failed:', e);
        btn.innerText = 'Error – try again';
        setTimeout(() => { btn.innerText = '🔔 Page Me'; btn.disabled = false; }, 4000);
      }
    }

    // ---------- Battery (works in Chromium/Fire WebView; falls back to Fully's API if enabled) ----------
    function updateBattery() {
      const el = $('battery');
      try {
        if (navigator.getBattery) {
          navigator.getBattery().then(b => { el.innerText = (b.charging ? '🔌 ' : '🔋 ') + Math.round(b.level * 100) + '%'; });
        } else if (window.fully && typeof fully.getBatteryLevel === 'function') {
          el.innerText = '🔋 ' + fully.getBatteryLevel() + '%';
        }
      } catch (e) {}
    }

    // ---------- Clock + nightly reload ----------
    function updateClock() {
      const now = new Date();
      $('time').innerText = fmtTime(now);
      $('date').innerText = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }
    function scheduleNightlyReload() {
      const now = new Date();
      let next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 2, 0, 0);
      if (next <= now) next = addDays(next, 1);
      setTimeout(() => location.reload(), next - now);
    }

    // ============================================================
    // START
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      $('btn-today').addEventListener('click', () => { lastInteraction = Date.now(); activeTab = 'today'; render(); });
      $('btn-tomorrow').addEventListener('click', () => { lastInteraction = Date.now(); activeTab = 'tomorrow'; render(); });
      $('page-button').addEventListener('click', sendPageAlert);

      updateClock();
      setInterval(updateClock, 1000);
      updateBattery();
      setInterval(updateBattery, 60000);
      scheduleNightlyReload();

      fetchState();
      fetchCalendar();
      setInterval(fetchState, STATE_POLL_MS);
      setInterval(fetchCalendar, CAL_POLL_MS);
      setInterval(render, 60000);   // keeps "past"/"active" styling and the stamp current between fetches
      document.addEventListener('visibilitychange', () => { if (!document.hidden) { fetchState(); fetchCalendar(); } });
    });
  </script>
</body>
</html>
